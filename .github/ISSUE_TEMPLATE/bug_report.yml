name: Bug Report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Stage changes
        2. Click generate
        3. ...
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: Model in use
      options:
        - Claude Opus 5
        - Claude Sonnet 5
        - Claude Haiku 4.5
        - GPT-5.6 Sol
        - GPT-5.6 Terra
        - GPT-5.6 Luna
        - Gemini 3.7 Flash
        - Gemini 3.1 Flash-Lite
        - Gemini 3.1 Pro (Preview)
        - DeepSeek V4 Flash
        - DeepSeek V4 Pro
        - Mistral Medium 3.5
        - Mistral Codestral
        - Not sure
    validations:
      required: true

  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      placeholder: "e.g. 1.99.0"
    validations:
      required: false
