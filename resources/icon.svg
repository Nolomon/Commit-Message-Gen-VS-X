<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34297a"/>
      <stop offset="0.55" stop-color="#1d1748"/>
      <stop offset="1" stop-color="#0f0c29"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="0.68" cy="0.26" r="0.62">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <!-- feather colours run tip (top) to base (bottom) in the feather's own upright frame -->
    <linearGradient id="vane" gradientUnits="userSpaceOnUse" x1="0" y1="-225" x2="0" y2="130">
      <stop offset="0" stop-color="#6ef3ff"/>
      <stop offset="0.45" stop-color="#6f8cff"/>
      <stop offset="1" stop-color="#c04dff"/>
    </linearGradient>
    <linearGradient id="gloss" gradientUnits="userSpaceOnUse" x1="-90" y1="0" x2="20" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="90" y2="0">
      <stop offset="0" stop-color="#1a0f4d" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0f4d" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="-32" y1="0" x2="32" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e6e2ff"/>
      <stop offset="1" stop-color="#b3a8f0"/>
    </linearGradient>
    <linearGradient id="rachis" gradientUnits="userSpaceOnUse" x1="0" y1="128" x2="0" y2="-206">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f3f0ff"/>
      <stop offset="1" stop-color="#eafcff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="lane" gradientUnits="userSpaceOnUse" x1="0" y1="262" x2="0" y2="345">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="tileClip"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
    <path id="vaneShape" d="M36,-228 C69.6,-216 96.3,-176 95.8,-122 C96,-102 91.8,-84 83.5,-64 L44.5,-98 C63.4,-72 75,-40 66.6,16 L30.4,-22 C44.2,6 49.2,40 39.9,72 C31.2,100 15,119 0,128 C-15,119 -36.8,99 -44.8,62 C-48.6,36 -39.9,-6 -19.8,-42 L-65.1,-4 C-73,-60 -58.8,-132 -26.1,-180 C-7.3,-206 16.2,-224 36,-228 Z"/>
    <clipPath id="vaneClip"><use href="#vaneShape"/></clipPath>
    <path id="spark" d="M0,-1 Q0.13,-0.13 1,0 Q0.13,0.13 0,1 Q-0.13,0.13 -1,0 Q-0.13,-0.13 0,-1 Z"/>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <rect x="16" y="16" width="480" height="480" fill="url(#tileGlow)"/>
  </g>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="url(#tileRim)" stroke-width="3"/>

  <!-- a row of the commit graph: lane, commit node, and the message the quill is writing -->
  <g clip-path="url(#tileClip)">
    <line x1="94" y1="262" x2="94" y2="500" stroke="url(#lane)" stroke-width="13"/>
  </g>
  <circle cx="94" cy="398" r="28" fill="#150f3a" stroke="#ffffff" stroke-width="13"/>
  <rect x="148" y="387" width="100" height="22" rx="11" fill="#ffffff"/>
  <rect x="148" y="429" width="70" height="17" rx="8.5" fill="#ffffff" opacity="0.5"/>

  <!-- quill: drawn upright, then tilted so the tip points up-right and the nib down-left -->
  <g transform="translate(335.2 215.3) rotate(25) scale(0.8)">
    <use href="#vaneShape" fill="url(#vane)" filter="url(#glow)" opacity="0.6" transform="translate(-10 10)"/>
    <use href="#vaneShape" fill="url(#vane)"/>
    <g clip-path="url(#vaneClip)">
      <path d="M-140,140 L0,140 L0,128 L0,116.1 L0.2,104.1 L0.4,92.2 L0.6,80.3 L1,68.4 L1.5,56.4 L2,44.5 L2.6,32.6 L3.3,20.6 L4,8.7 L4.9,-3.2 L5.8,-15.1 L6.8,-27.1 L7.9,-39 L9.1,-50.9 L10.3,-62.9 L11.7,-74.8 L13.1,-86.7 L14.6,-98.6 L16.2,-110.6 L17.8,-122.5 L19.6,-134.4 L21.4,-146.4 L23.3,-158.3 L25.3,-170.2 L27.3,-182.1 L29.5,-194.1 L31.7,-206 L38.5,-240 L-140,-240 Z" fill="url(#gloss)"/>
      <path d="M160,140 L0,140 L0,128 L0,116.1 L0.2,104.1 L0.4,92.2 L0.6,80.3 L1,68.4 L1.5,56.4 L2,44.5 L2.6,32.6 L3.3,20.6 L4,8.7 L4.9,-3.2 L5.8,-15.1 L6.8,-27.1 L7.9,-39 L9.1,-50.9 L10.3,-62.9 L11.7,-74.8 L13.1,-86.7 L14.6,-98.6 L16.2,-110.6 L17.8,-122.5 L19.6,-134.4 L21.4,-146.4 L23.3,-158.3 L25.3,-170.2 L27.3,-182.1 L29.5,-194.1 L31.7,-206 L38.5,-240 L160,-240 Z" fill="url(#shade)"/>
    </g>
    <use href="#vaneShape" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.5"/>
    <!-- spine -->
    <path d="M0,128 L0,116.1 L0.2,104.1 L0.4,92.2 L0.6,80.3 L1,68.4 L1.5,56.4 L2,44.5 L2.6,32.6 L3.3,20.6 L4,8.7 L4.9,-3.2 L5.8,-15.1 L6.8,-27.1 L7.9,-39 L9.1,-50.9 L10.3,-62.9 L11.7,-74.8 L13.1,-86.7 L14.6,-98.6 L16.2,-110.6 L17.8,-122.5 L19.6,-134.4 L21.4,-146.4 L23.3,-158.3 L25.3,-170.2 L27.3,-182.1 L29.5,-194.1 L31.7,-206" fill="none" stroke="#2a1a6e" stroke-opacity="0.28" stroke-width="7" stroke-linecap="round" transform="translate(4 2)"/>
    <path d="M-5.8,128 L-5.6,116.1 L-5.3,104.1 L-4.9,92.2 L-4.5,80.3 L-4,68.4 L-3.4,56.4 L-2.7,44.5 L-1.9,32.6 L-1.1,20.6 L-0.1,8.7 L0.9,-3.2 L1.9,-15.1 L3.1,-27.1 L4.4,-39 L5.7,-50.9 L7.1,-62.9 L8.6,-74.8 L10.2,-86.7 L11.9,-98.6 L13.6,-110.6 L15.5,-122.5 L17.4,-134.4 L19.4,-146.4 L21.5,-158.3 L23.6,-170.2 L25.9,-182.1 L28.2,-194.1 L30.7,-206 L32.7,-206 L30.7,-194.1 L28.8,-182.1 L26.9,-170.2 L25.1,-158.3 L23.4,-146.4 L21.7,-134.4 L20.2,-122.5 L18.7,-110.6 L17.3,-98.6 L16,-86.7 L14.7,-74.8 L13.6,-62.9 L12.5,-50.9 L11.5,-39 L10.5,-27.1 L9.7,-15.1 L8.9,-3.2 L8.2,8.7 L7.6,20.6 L7.1,32.6 L6.6,44.5 L6.3,56.4 L6,68.4 L5.8,80.3 L5.7,92.2 L5.6,104.1 L5.6,116.1 L5.8,128 Z" fill="url(#rachis)" stroke="url(#rachis)" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- shaft, collar, nib -->
    <line x1="0" y1="122" x2="0" y2="166" stroke="url(#metal)" stroke-width="15" stroke-linecap="round"/>
    <rect x="-17" y="156" width="34" height="13" rx="5" fill="#cfc6ff"/>
    <path d="M-19,168 L19,168 C36,192 31,212 0,252 C-31,212 -36,192 -19,168 Z" fill="url(#metal)"/>
    <circle cx="0" cy="196" r="6.5" fill="#1d1748"/>
    <line x1="0" y1="200" x2="0" y2="244" stroke="#1d1748" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- sparkle -->
  <g transform="translate(166 150)">
    <use href="#spark" transform="scale(58)" fill="#a8e9ff" filter="url(#softGlow)" opacity="0.8"/>
    <use href="#spark" transform="scale(50)" fill="#ffffff"/>
  </g>
  <use href="#spark" transform="translate(236 88) scale(17)" fill="#ffffff" opacity="0.9"/>
</svg>
